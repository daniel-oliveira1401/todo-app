<section class="todos" >
    <div class="title-bar">
        <h1>Todo App</h1>
        <div class="stats">
            <span aria-label="Number of completed todos">Concluídos: {{countCompletedTodos()}}</span>
            <span aria-label="Number of todos pending completion" >Pendentes: {{countPendingTodos()}}</span>
        </div>
    </div>
    <form class="add-todo" (submit)="addTodo($event)">
        <input placeholder="Ex: Lavar a Louça" class="add-todo_title" [formControl]="titleFormControl" type="text">
        <button [disabled]="!titleFormControl.valid" aria-label="Add todo" title="Add todo" type="submit" class="add-todo__icon">
            <svg aria-label="Black '+' sign" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/>
                Add Todo
            </svg>
        </button>
    </form>
    <ul role="list" aria-label="List of todo items" class="todo-list">
        @for (todo of todos(); track todo.id) {
            <li [ariaLabel]="todo.title" role="listitem">
                <app-todo-item-component 
                    [todo]="todo"
                    (removeTodo)="removeTodo($event)" 
                    (updateTodo)="updateTodo($event)"
                />
            </li>
        }
    </ul>

</section>
