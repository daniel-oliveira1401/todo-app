<div class="todo-item" [ngClass]="{'completed': todo.completed}">
    <input [ariaLabel]="getLabelForCheckbox()" title="{{'Mark todo item as' + todo.completed? 'Pendente' : 'Finalizado'}}" name="toggleTodo" (change)="toggleTodo()" type="checkbox" class="todo-item__completion" [ariaChecked]="todo.completed" [checked]="todo.completed">
    
    <h3 class="todo-item__title">
        {{todo.title}}
    </h3>
    <button aria-label="Remove todo item" title="{{'Remove Todo Item ' + todo.title}}" (click)="removeTodo.emit(todo)" class="todo-item__remove">
        <svg aria-label="Red 'X' Icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
            
        </svg>
    </button>
</div>
